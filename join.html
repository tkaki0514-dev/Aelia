</style></head><body><div class="box">
<div id="f"><h1>Aelia</h1><h2>つくった人とつながる</h2><p>つくった人の画面に出ている<b>コード</b>を入れてね。</p>

</div><script>
const AeliaNet=(function(){
  const BROKERS=['wss://broker.hivemq.com:8884/mqtt','wss://broker.emqx.io:8084/mqtt','wss://test.mosquitto.org:8081/mqtt'];
  const te=new TextEncoder(),td=new TextDecoder();
  const rid=()=>Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>(b%36).toString(36)).join('');
  const str=s=>{const b=te.encode(s);const o=new Uint8Array(2+b.length);o[0]=b.length>>8;o[1]=b.length&255;o.set(b,2);return o;};
  const remLen=n=>{const a=[];do{let d=n%128;n=Math.floor(n/128);if(n>0)d|=128;a.push(d);}while(n>0);return a;};
  const cat=(...p)=>{let l=0;p.forEach(x=>l+=x.length);const o=new Uint8Array(l);let k=0;p.forEach(x=>{o.set(x,k);k+=x.length;});return o;};
  const pkt=(hdr,body)=>cat(Uint8Array.from([hdr,...remLen(body.length)]),body);

  class Conn{
    constructor(url,topic,onmsg){this.url=url;this.topic=topic;this.onmsg=onmsg;this.ws=null;this.buf=new Uint8Array(0);this.alive=false;this.closed=false;this.ping=null;this.pid=1;}
    open(timeout){
      return new Promise((res,rej)=>{
        let done=false;const fail=e=>{if(!done){done=true;try{this.ws&&this.ws.close();}catch(_){}rej(e||new Error('fail'));}};
        const to=setTimeout(()=>fail(new Error('timeout')),timeout||4500);
        let ws;try{ws=new WebSocket(this.url,'mqtt');}catch(e){clearTimeout(to);return fail(e);}
        ws.binaryType='arraybuffer';this.ws=ws;
        ws.onopen=()=>{ws.send(pkt(0x10,cat(str('MQTT'),Uint8Array.from([4,2,0,45]),str('ae'+rid()))));};
        ws.onerror=()=>fail(new Error('ws'));
        ws.onclose=()=>{clearInterval(this.ping);this.alive=false;if(!done){fail(new Error('closed'));}else if(!this.closed&&this.onclose)this.onclose();};
        ws.onmessage=ev=>{
          this.buf=cat(this.buf,new Uint8Array(ev.data));
          for(;;){const b=this.buf;if(b.length<2)break;let m=1,len=0,mul=1,i=1,ok=false;
            for(;i<b.length&&i<5;i++){len+=(b[i]&127)*mul;mul*=128;if(!(b[i]&128)){ok=true;i++;break;}}
            if(!ok||b.length<i+len)break;
            const type=b[0]>>4,body=b.subarray(i,i+len);this.buf=b.slice(i+len);
            if(type===2){ // CONNACK
              if(body[1]!==0)return fail(new Error('refused'));
              ws.send(pkt(0x82,cat(Uint8Array.from([this.pid>>8,this.pid&255]),str(this.topic),Uint8Array.from([0]))));
            }else if(type===9){ // SUBACK
              if(!done){done=true;clearTimeout(to);this.alive=true;this.ping=setInterval(()=>{try{ws.send(Uint8Array.from([0xC0,0]));}catch(_){}},20000);res(this);}
            }else if(type===3){ // PUBLISH
              const qos=(b[0]>>1)&3;const tl=(body[0]<<8)|body[1];let off=2+tl;if(qos>0)off+=2;
              try{this.onmsg(td.decode(body.subarray(off)));}catch(_){}
            }
          }
        };
      });
    }
    send(text){const body=cat(str(this.topic),te.encode(text));this.ws.send(pkt(0x30,body));}
    close(){this.closed=true;clearInterval(this.ping);try{this.ws.close();}catch(_){}}
  }

  async function connect(topic,onmsg,brokers){
    let last=null;
    for(const u of (brokers||window.__AE_BROKERS||BROKERS)){try{const c=new Conn(u,topic,onmsg);await c.open(4500);return c;}catch(e){last=e;}}
    throw last||new Error('no broker');
  }

  // room-like object: join / emit / on / leave
  async function join(name,brokers){
    const me=rid(),L={};let conn=null,closed=false;
    const dispatch=(topic,data,peer,isMe)=>{(L[topic]||[]).forEach(fn=>{try{fn({peer,isMe,sameTab:isMe,topic,data});}catch(_){}});};
    const onmsg=txt=>{let m;try{m=JSON.parse(txt);}catch(_){return;}if(!m||m.p===me||typeof m.t!=='string')return;dispatch(m.t,m.d,m.p,false);};
    const topic='aelia1/'+name;
    conn=await connect(topic,onmsg,brokers);
    const reconnect=async()=>{for(let k=0;k<8&&!closed;k++){await new Promise(r=>setTimeout(r,1500+k*700));if(closed)return;try{const c=await connect(topic,onmsg,brokers);if(closed){c.close();return;}conn=c;c.onclose=reconnect;return;}catch(_){}}};
    conn.onclose=reconnect;
    return{
      kind:'mqtt',chunk:20000,me,
      async emit(t,d){const m={t,d:d===undefined?null:d,p:me};const txt=JSON.stringify(m);
        setTimeout(()=>dispatch(t,JSON.parse(JSON.stringify(m.d)),me,true),0);
        if(!conn||!conn.alive)throw new Error('offline');
        if(conn.ws.bufferedAmount>2e6)await new Promise(r=>setTimeout(r,200));
        conn.send(txt);},
      on(t,fn){(L[t]=L[t]||[]).push(fn);return()=>{L[t]=(L[t]||[]).filter(x=>x!==fn);};},
      onPeers(){return()=>{};},
      async leave(){closed=true;try{conn&&conn.close();}catch(_){}}
    };
  }
  // is any relay reachable from here?
  async function probe(brokers){
    try{const c=await connect('aelia1/_probe'+rid(),()=>{},brokers);c.close();return true;}catch(e){return false;}
  }
  return{join,probe,BROKERS};
})();
const $=i=>document.getElementById(i);
const te=new TextEncoder(),td=new TextDecoder();
const b64=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s);};
const unb64=s=>{const t=atob(s),u=new Uint8Array(t.length);for(let i=0;i<t.length;i++)u[i]=t.charCodeAt(i);return u;};
const rand=n=>Array.from(crypto.getRandomValues(new Uint8Array(n)),b=>(b%36).toString(36)).join('');
async function deriveKey(pw,sid){const base=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:te.encode('aelia:'+sid),iterations:60000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function enc(k,bytes){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,bytes));const o=new Uint8Array(12+ct.length);o.set(iv);o.set(ct,12);return b64(o);}
async function dec(k,s){const o=unb64(s);return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:o.subarray(0,12)},k,o.subarray(12)));}
const parseSid=t=>{t=String(t||'').trim();const x=/(?:[#?&]j=|#join-|aelia-join:)([a-z0-9]{8})/i.exec(t)||/^([a-z0-9]{8})$/i.exec(t);return x?x[1].toLowerCase():'';};
let sid=parseSid(location.hash+location.search);
if(!sid){$('sl').hidden=false;$('sid').hidden=false;}
try{$('nm').value=localStorage.getItem('aelia.name.guest')||'';}catch(e){}
let room,key,host='ホスト',me;const asm=new Map();
function onChunk(t,h){room.on(t,async m=>{if(m.isMe||!m.data||typeof m.data.d!=='string')return;const k=m.peer+':'+m.data.id;let a=asm.get(k);if(!a){a={p:[],g:0,n:m.data.n};asm.set(k,a);}
 if(a.p[m.data.i]===undefined){a.p[m.data.i]=m.data.d;a.g++;}
 if(a.g>=a.n&&a.n>0&&a.n<400){asm.delete(k);try{h(await dec(key,a.p.join('')));}catch(e){}}});}
async function sendBlob(t,bytes){const CH=room.chunk||20000;const s=await enc(key,bytes);const id=rand(6),n=Math.ceil(s.length/CH);for(let i=0;i<n;i++)await room.emit(t,{id,i,n,d:s.slice(i*CH,(i+1)*CH)});}
async function toJpeg(f){const bmp=await createImageBitmap(f);const sc=Math.min(1,1280/Math.max(bmp.width,bmp.height));const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);const c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,cv.width,cv.height);c.drawImage(bmp,0,0,cv.width,cv.height);let b;for(let q=.8;q>=.3;q-=.12){b=await new Promise(r=>cv.toBlob(r,'image/jpeg',q));if(b.size<=150000)break;}return b;}
$('go').onclick=async()=>{const e=$('er');const name=$('nm').value.replace(/[\u0000-\u001f<>]/g,'').trim().slice(0,16);const pw=$('cd').value.normalize('NFKC').replace(/[\s\-]/g,'');
 const s=sid||parseSid($('sid').value);if(!name){e.textContent='名前を入れてね';return;}if(!pw){e.textContent='コードを入れてね';return;}if(!/^[a-z0-9]{8}$/.test(s)){e.textContent='ルームコードが正しくないよ';return;}
 e.textContent='つないでいます…';$('go').disabled=true;
 try{key=await deriveKey(pw,s);room=await AeliaNet.join('ae'+s);
  const r=await new Promise(res=>{let d=0;const fin=v=>{if(!d){d=1;res(v);}};
   room.on('ae-hello',m=>{if(m.isMe&&m.sameTab)me=m.peer;});
   room.on('ae-ok',async m=>{if(!m.data||m.data.to!==me)return;try{const t=td.decode(await dec(key,m.data.n));if(t.indexOf('AELIA-OK:')===0){host=t.slice(9)||'ホスト';fin(true);}}catch(x){}});
   room.on('ae-no',m=>{if(m.data&&m.data.to===me)fin('コードがちがうよ。つくった人の画面を見てね');});
   enc(key,te.encode('AELIA-HELLO:'+name)).then(n=>room.emit('ae-hello',{n}));
   setTimeout(()=>fin('だれにもつながりません。コードかルームコードが、ちがうかもしれないよ'),7000);});
  if(r!==true){try{await room.leave();}catch(x){}room=null;e.textContent=r;$('go').disabled=false;return;}
  try{localStorage.setItem('aelia.name.guest',name);}catch(x){}
  setInterval(()=>room.emit('ae-hb',{}).catch(()=>{}),8000);
  onChunk('ae-scr',b=>{const u=URL.createObjectURL(new Blob([b],{type:'image/jpeg'}));const im=$('fr');const o=im.src;im.src=u;im.style.display='block';if(o)URL.revokeObjectURL(o);});
  onChunk('ae-pic',b=>{const im=document.createElement('img');im.src=URL.createObjectURL(new Blob([b],{type:'image/jpeg'}));im.style.cssText='width:100%;border-radius:12px;margin-top:10px';$('pic').prepend(im);});
  $('f').hidden=true;$('c').hidden=false;document.querySelector('.box').classList.add('wide');$('who').textContent=host+' さんとつながり中';
  addEventListener('pagehide',()=>{try{room.emit('ae-bye',{});}catch(x){}});
 }catch(x){e.textContent='つなげませんでした。ネットにつながっているか、たしかめてね';$('go').disabled=false;}};
$('img').onclick=()=>{$('file').value='';$('file').click();};
$('file').onchange=async()=>{const f=$('file').files[0];if(!f)return;$('er2').textContent='送っています…';try{await sendBlob('ae-img',new Uint8Array(await (await toJpeg(f)).arrayBuffer()));$('er2').textContent='送りました！';}catch(e){$('er2').textContent='送れませんでした';}};
$('wt').onclick=()=>{room.emit('ae-want',{v:1}).catch(()=>{});$('wt').textContent='画面を待っています…';};

/* ---- 書く欄・メニュー2（保存・履歴・タイムマシン） ---- */
(function(){
const pad=$('pad'),cx=pad.getContext('2d'),COL=['#ffffff','#ffe66d','#ff9fb0','#7fd8ff','#a8f5c2','#ffb86b','#d6a8ff','#ff6b6b'];
let strokes=[],cur=null,color=COL[0],mode='pen',hist=[JSON.stringify([])],base=null,playing=0;
const SK='aelia.join.saves.v1';
const redraw=()=>{cx.clearRect(0,0,1000,750);cx.lineCap='round';cx.lineJoin='round';
 strokes.concat(cur?[cur]:[]).forEach(s=>{cx.strokeStyle=s.c;cx.lineWidth=5;cx.shadowColor=s.c;cx.shadowBlur=6;cx.beginPath();s.p.forEach((q,i)=>i?cx.lineTo(q[0],q[1]):cx.moveTo(q[0],q[1]));if(s.p.length===1)cx.lineTo(s.p[0][0]+.1,s.p[0][1]);cx.stroke();});cx.shadowBlur=0;};
const pt=e=>{const r=pad.getBoundingClientRect();return[(e.clientX-r.left)*1000/r.width,(e.clientY-r.top)*750/r.height];};
const segD=(p,a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let t=l?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy);};
const hit=(q,s)=>{for(let i=0;i<s.p.length-1;i++)if(segD(q,s.p[i],s.p[i+1])<18)return true;return s.p.length===1&&Math.hypot(q[0]-s.p[0][0],q[1]-s.p[0][1])<18;};
const snapNow=()=>{const j=JSON.stringify(strokes);if(j!==hist[hist.length-1]){hist.push(j);if(hist.length>80)hist.splice(1,1);}sync();};
let down=false;
pad.addEventListener('pointerdown',e=>{if(base)commit();down=true;try{pad.setPointerCapture(e.pointerId);}catch(_){}const q=pt(e);
 if(mode==='pen')cur={c:color,p:[q]};else eraseAt(q);redraw();e.preventDefault();});
pad.addEventListener('pointermove',e=>{if(!down)return;const q=pt(e);if(mode==='pen'&&cur)cur.p.push(q);else if(mode==='era')eraseAt(q);redraw();});
const up=()=>{if(!down)return;down=false;if(cur){strokes.push(cur);cur=null;}redraw();snapNow();};
pad.addEventListener('pointerup',up);pad.addEventListener('pointercancel',up);
function eraseAt(q){strokes=strokes.filter(s=>!hit(q,s));}
const sw=$('sw');COL.forEach((c,i)=>{const d=document.createElement('i');d.style.background=c;if(!i)d.className='on';d.onclick=()=>{color=c;mode='pen';setMode();[...sw.children].forEach(x=>x.classList.toggle('on',x===d));};sw.appendChild(d);});
function setMode(){$('mpen').classList.toggle('on',mode==='pen');$('mera').classList.toggle('on',mode==='era');}
$('mpen').onclick=()=>{mode='pen';setMode();};$('mera').onclick=()=>{mode=mode==='era'?'pen':'era';setMode();};
$('mclr').onclick=()=>{if(!strokes.length)return;strokes=[];redraw();snapNow();};
$('wbtn').onclick=()=>{const w=$('wr');w.hidden=!w.hidden;$('wbtn').classList.toggle('on',!w.hidden);if(!w.hidden){redraw();w.scrollIntoView({behavior:'smooth',block:'nearest'});}};
$('m2btn').onclick=()=>{const m=$('m2');m.hidden=!m.hidden;$('m2btn').classList.toggle('on',!m.hidden);if(!m.hidden){sync();list();}};
/* time machine */
const sl=$('tms'),lab=$('tml');
function label(){lab.textContent=(+sl.value+1)+' / '+hist.length+(base?'（見ているところ）':'（いま）');}
function sync(){sl.max=Math.max(0,hist.length-1);if(!base)sl.value=sl.max;label();}
function show(v){if(!base)base=JSON.stringify(strokes);strokes=JSON.parse(hist[v]);redraw();label();}
function stop(){if(playing){clearInterval(playing);playing=0;$('tmp').textContent='▶ 再生';}}
function commit(){stop();if(!base)return;const v=+sl.value;hist=hist.slice(0,v+1);base=null;sync();}
sl.oninput=()=>{stop();$('wr').hidden&&($('wr').hidden=false,$('wbtn').classList.add('on'));show(+sl.value);};
$('tmp').onclick=()=>{if(playing){stop();return;}if(hist.length<2)return;$('wr').hidden=false;$('wbtn').classList.add('on');let v=0;sl.value=0;show(0);$('tmp').textContent='■ とめる';
 playing=setInterval(()=>{v++;if(v>=hist.length){stop();return;}sl.value=v;show(v);},420);};
$('tmo').onclick=commit;
$('tmu').onclick=()=>{stop();if(base){strokes=JSON.parse(base);base=null;redraw();}sync();};
/* save / history */
const load=()=>{try{const a=JSON.parse(localStorage.getItem(SK)||'[]');return Array.isArray(a)?a:[];}catch(e){return[];}};
const store=a=>{while(a.length){try{localStorage.setItem(SK,JSON.stringify(a));return true;}catch(e){a.pop();}}return false;};
const stamp=t=>{const d=new Date(t),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'/'+p(d.getMonth()+1)+'/'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());};
function thumb(){const o=document.createElement('canvas');o.width=200;o.height=150;const c=o.getContext('2d');c.fillStyle='#0b2a22';c.fillRect(0,0,200,150);c.drawImage(pad,0,0,200,150);return o.toDataURL('image/jpeg',.6);}
function list(){const a=load(),box=$('hl');box.innerHTML='';if(!a.length){box.innerHTML='<p>まだ、保存したものはないよ</p>';return;}
 a.forEach(it=>{const r=document.createElement('div');r.className='li';r.innerHTML='<img alt=""><span></span><button>呼び出す</button><button class="sub">🗑</button>';
  r.querySelector('img').src=it.th;r.querySelector('span').textContent=stamp(it.t);
  const bs=r.querySelectorAll('button');
  bs[0].onclick=()=>{commit();hist.push(JSON.stringify(strokes));strokes=it.s;redraw();hist.push(JSON.stringify(strokes));sync();$('wr').hidden=false;$('wbtn').classList.add('on');$('wr').scrollIntoView({behavior:'smooth',block:'nearest'});};
  bs[1].onclick=()=>{store(load().filter(x=>x.id!==it.id));list();};
  box.appendChild(r);});}
$('svb').onclick=()=>{commit();if(!strokes.length){$('svb').textContent='まだ、なにも書かれていないよ';setTimeout(()=>$('svb').textContent='いまの内容を保存',1500);return;}
 redraw();const a=load();a.unshift({id:Date.now().toString(36),t:Date.now(),th:thumb(),s:strokes});if(a.length>30)a.length=30;
 $('svb').textContent=store(a)?'保存したよ！':'保存できませんでした';setTimeout(()=>$('svb').textContent='いまの内容を保存',1500);list();};
sync();
})();
</script></body></html>
